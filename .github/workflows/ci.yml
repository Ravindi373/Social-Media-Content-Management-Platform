name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Tests run against an in-memory SQLite database (see src/config/database.js),
      # so no external database service or secrets are needed for CI to go green.
      - run: npm test

  frontend:
    name: Frontend tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

  # Optional: ping Render's deploy hook once both test jobs pass on main.
  # This is NOT required for deployment — if you connect your Render service
  # directly to this GitHub repo in Render's dashboard, Render auto-deploys
  # on every push to main on its own. This job is only useful if you'd
  # rather gate deployment behind CI passing first. Safe to ignore/remove
  # if you're using Render's built-in auto-deploy.
  trigger-render-deploy:
    name: Trigger Render deploy (optional)
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Call Render deploy hook if configured
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
            echo "Render deploy triggered."
          else
            echo "RENDER_DEPLOY_HOOK_URL secret not set — skipping. This is fine if Render's own auto-deploy-on-push is already connected to this repo."
          fi
